name: voice-regression

# Existing paid replay cadence is unchanged. Routine positive canary fixtures
# are currently unqualified: preflight fails visibly before any provider call.
# This means monitoring is blocked, not that provider billing failed. Do not hide
# synthetic labels, skip the gate or retry those packets to obtain a green run.
# Retained normal-run observations are a separate future monitoring input; they
# cannot establish source truth or all required check results without exact joins.
# No current all-in price or monthly-savings estimate has been established.
# PR replay remains opt-in, with hermetic required CI independent of paid probes.

on:
  schedule:
    - cron: '17 9 * * 1-6'   # daily canary preflight; unqualified fixtures make no provider calls
    - cron: '0 9 * * 0'    # weekly full suite (Sunday)
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  # Per-PR group so rapid pushes cancel the stale paid run; scheduled and
  # manual runs keep unique groups and never cancel each other.
  group: voice-regression-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keyless PR gate: does this PR touch the writer path? ($0 — no model call)
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      writer_paths: ${{ steps.filter.outputs.writer_paths }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHANGED=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --json files -q '.files[].path')
          echo "changed files:"; echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^src/two_bot/(prompts/|writer\.py$)'; then
            echo "writer_paths=true" >> "$GITHUB_OUTPUT"
          else
            echo "writer_paths=false" >> "$GITHUB_OUTPUT"
          fi

  replay:
    # Existing scheduled/manual evaluations retain their cadence. New PR
    # iterations require an explicit paid-evaluation opt-in: changing prompts
    # or applying voice-check alone must not silently buy another full replay.
    needs: [changes]
    if: >
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 0') ||
        (github.event_name == 'pull_request' &&
          vars.THEHEAT_PAID_PR_REPLAY_ENABLED == '1' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (github.event.action != 'labeled' || github.event.label.name == 'voice-check') &&
          (needs.changes.outputs.writer_paths == 'true' ||
           contains(github.event.pull_request.labels.*.name, 'voice-check')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run voice-regression replay (full suite)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pytest tests/voice_regression/ -v -m voice_replay

  canary:
    # Positive writer monitor; fixture qualification precedes every paid call.
    if: github.event_name == 'schedule' && github.event.schedule == '17 9 * * 1-6'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      # Report existing production evidence without a model request. Its exit0
      # only means the report was read; the separate positive gate stays visible.
      - name: Read retained writer operating evidence
        env:
          GH_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          set -euo pipefail
          STATE_PATH="$RUNNER_TEMP/theheat-writer-health-state.json"
          trap 'rm -f "$STATE_PATH"' EXIT
          gh gist view "$GIST_ID" -f state.json > "$STATE_PATH"
          python scripts/writer_health.py "$STATE_PATH"

      - name: Run canary qualification and positive writer gate
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pytest tests/voice_regression/ -v -m voice_canary
