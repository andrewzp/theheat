name: source-health-sentinel

# Turns every currently-failing source into a tracked GitHub issue so the
# operator never has to watch the dashboard. Every failure is a product gap, so
# every failing source gets an issue (labeled `ours` vs `external` so the fix is
# obvious); issues auto-close when the source recovers. The classifier and the
# create/close plan live in scripts/source_health_sentinel.py and are
# unit-tested; this workflow fetches the gist and runs the reconciler.

on:
  schedule:
    # Hourly at :23, separate from the bot. The reconciler is idempotent:
    # it only creates an issue a source doesn't already have, and it can now
    # detect a stale alerts lane within a few hours even if auto_publish_due runs
    # keep writing fresh state.
    - cron: '23 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: read   # workflow_health.py reads each scheduled workflow's run history

concurrency:
  group: source-health-sentinel
  cancel-in-progress: false

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch state.json from gist
        env:
          GH_TOKEN: ${{ secrets.THEHEAT_GIST_WRITER_TOKEN || secrets.GH_GIST_TOKEN }}
        run: gh gist view "${{ secrets.GIST_ID }}" -f state.json > /tmp/state.json

      # Opens an issue for each currently-failing source, closes the issue of any
      # source that has recovered. Runs live because GITHUB_ACTIONS=true.
      - name: Reconcile source-failure issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THEHEAT_PRODUCTION_PAUSED: ${{ vars.THEHEAT_PRODUCTION_PAUSED }}
        run: python scripts/source_health_sentinel.py /tmp/state.json

      # Observe the five scheduled workflows themselves: turn any that are red on
      # main into an auto-closing `workflow-health` issue (the signal the daily
      # self-heal routine consumes), and flag the self-heal routine if its
      # heartbeat is stale. Independent of the bot's gist state — reads the
      # Actions API directly. Always exits 0; never gates the sentinel.
      - name: Reconcile workflow-health issues
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The default GITHUB_TOKEN cannot read the Actions *variables* REST
          # endpoint, so inject the self-heal heartbeat directly from the `vars`
          # context. workflow_health.py reads this env first; without it the
          # stale-heartbeat meta-guard would silently never fire.
          SELFHEAL_BEACON: ${{ vars.SELFHEAL_BEACON }}
          THEHEAT_PRODUCTION_PAUSED: ${{ vars.THEHEAT_PRODUCTION_PAUSED }}
          THEHEAT_PAID_EVALUATION_ENABLED: ${{ vars.THEHEAT_PAID_EVALUATION_ENABLED }}
        run: python scripts/workflow_health.py

  alerts-catchup:
    # GitHub fires only some scheduled runs (about 8 of the bot's 30 daily slots
    # in late Oct and early Nov 2026), so a dropped four-hour slot can leave the
    # alerts lane stale for most of a day (05:50 to 14:51 UTC on 2026-11-07).
    # When the retained alerts start is older than the bot's own catch-up window,
    # ask for one ordinary alerts run; a workflow_dispatch starts right away.
    # Separate job so only this step's token can start workflows; the
    # reconcilers above keep their read-only Actions scope.
    if: vars.THEHEAT_PRODUCTION_PAUSED != '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch state.json from gist
        env:
          GH_TOKEN: ${{ secrets.THEHEAT_GIST_WRITER_TOKEN || secrets.GH_GIST_TOKEN }}
        run: gh gist view "${{ secrets.GIST_ID }}" -f state.json > "$RUNNER_TEMP/state.json"

      # Same staleness rule as the bot's hourly catch-up (exit 0 = stale; recent
      # or unreadable state dispatches nothing). Skip when a main bot run is
      # already queued or running: it may be the missing slot, and the bot's
      # shared lock would only hold this one behind it.
      - name: Dispatch one alerts run when the lane is stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! python scripts/alerts_lane_catchup.py "$RUNNER_TEMP/state.json"; then
            exit 0
          fi
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow bot.yml --branch main --limit 20 \
            --json status --jq '[.[] | select(.status != "completed")] | length') || active=unknown
          if [[ "$active" != 0 ]]; then
            echo "alerts catch-up: bot run already active ($active); not dispatching"
            exit 0
          fi
          gh workflow run bot.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=alerts
          echo "alerts catch-up: dispatched one alerts run"
