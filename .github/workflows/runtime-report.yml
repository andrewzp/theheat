# Generated by scripts/gen_runtime_report_workflow.py; do not hand-edit profile inputs.
name: runtime-configuration-report
on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: Exact deployed commit; configuration only, no model or posting call
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: theheat-runtime-report
  cancel-in-progress: false
jobs:
  report:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.THEHEAT_PRODUCTION_PAUSED == '1' &&
      vars.THEHEAT_AUTOMATIC_PUBLICATION_ENABLED != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install existing application dependencies
        run: pip install -r requirements.txt
      - name: Verify ordinary editorial profile parity
        run: python scripts/gen_runtime_report_workflow.py --check
      - name: Publish configuration evidence only
        env:
          GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
          ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
          GIST_ID: "${{ secrets.GIST_ID }}"
          GITHUB_TOKEN: "${{ secrets.GH_GIST_TOKEN }}"
          THEHEAT_CRITIC_ENABLED: "${{ vars.THEHEAT_CRITIC_ENABLED || '1' }}"
          THEHEAT_WRITER_SAMPLES: "${{ vars.THEHEAT_WRITER_SAMPLES || '1' }}"
          THEHEAT_CRITIC_REVISE_ENABLED: "${{ vars.THEHEAT_CRITIC_REVISE_ENABLED || '0' }}"
          THEHEAT_PM25_FORECAST_AUTO_TEXT: "${{ vars.THEHEAT_PM25_FORECAST_AUTO_TEXT || '0' }}"
          THEHEAT_DUST_FORECAST_AUTO_TEXT: "${{ vars.THEHEAT_DUST_FORECAST_AUTO_TEXT || '0' }}"
          THEHEAT_NHC_ADVISORY_AUTO_TEXT: "${{ vars.THEHEAT_NHC_ADVISORY_AUTO_TEXT || '0' }}"
          THEHEAT_OFFICIAL_WARNING_AUTO_TEXT: "${{ vars.THEHEAT_OFFICIAL_WARNING_AUTO_TEXT || '0' }}"
          THEHEAT_NWS_WARNING_AUTO_TEXT: "${{ vars.THEHEAT_NWS_WARNING_AUTO_TEXT || '0' }}"
          THEHEAT_REGIONAL_OBSERVED: "${{ vars.THEHEAT_REGIONAL_OBSERVED || '0' }}"
          THEHEAT_RAINFALL_WINDOW_PROVENANCE: "${{ vars.THEHEAT_RAINFALL_WINDOW_PROVENANCE || '0' }}"
          THEHEAT_HAZARD_EPISODES: "${{ vars.THEHEAT_HAZARD_EPISODES || '0' }}"
          THEHEAT_PORTFOLIO_SELECTION: "${{ vars.THEHEAT_PORTFOLIO_SELECTION || '0' }}"
          THEHEAT_RAINFALL_REGIONAL_SCAN: "${{ vars.THEHEAT_RAINFALL_REGIONAL_SCAN || '0' }}"
          THEHEAT_AUTOMATIC_PUBLICATION_ENABLED: "${{ vars.THEHEAT_AUTOMATIC_PUBLICATION_ENABLED || '0' }}"
          EXPECTED_COMMIT_SHA: "${{ inputs.expected_commit_sha }}"
          THEHEAT_PRODUCTION_PAUSED: "${{ vars.THEHEAT_PRODUCTION_PAUSED }}"
        run: python scripts/runtime_report.py
