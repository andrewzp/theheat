name: refresh-thresholds

on:
  schedule:
    # Every Sunday at 02:00 UTC — well after NOAA's ~21 UTC daily publish
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days to look back in superghcnd_diff'
        required: false
        default: '12'
        type: string
      resume_run_id:
        description: 'Run ID of an interrupted refresh with a sealed checkpoint'
        required: false
        type: string
      catch_up:
        description: 'Allow 30 minutes for a manual catch-up (routine limit is 15 minutes)'
        required: false
        default: false
        type: boolean

concurrency:
  group: refresh-thresholds
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.THEHEAT_PRODUCTION_PAUSED != '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Leave 15 minutes beyond acquisition for sealing or publication.
    # Schedules and ordinary manual refreshes retain their existing limits.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.catch_up == true && 45 || 30 }}
    # Provision the dedicated checkpoint key here with a main-only deployment
    # branch policy before enabling checkpoint mode.
    environment: threshold-maintenance
    permissions:
      contents: write  # needed for gh release upload
      actions: read  # read only the explicitly selected interrupted run

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Restore exact committed threshold cache
        uses: actions/cache/restore@v4
        with:
          path: data/station_thresholds.sqlite
          key: ghcn-thresholds-${{ runner.os }}-${{ hashFiles('data/station_thresholds.version') }}

      - name: Validate or download checksum-bound baseline
        env:
          GH_TOKEN: ${{ github.token }}
          THRESHOLD_REPO: ${{ github.repository }}
        run: python -m scripts.threshold_artifacts ensure --repo "$THRESHOLD_REPO"

      - name: Recover missing committed baseline without replacement
        env:
          GH_TOKEN: ${{ github.token }}
          THRESHOLD_REPO: ${{ github.repository }}
        run: python -m scripts.threshold_artifacts restore-baseline --repo "$THRESHOLD_REPO"

      - name: Require contiguous baseline lineage before mutation
        env:
          THRESHOLD_DAYS: ${{ github.event.inputs.days || '12' }}
        run: python -m scripts.threshold_artifacts require-lineage --days "$THRESHOLD_DAYS"

      - name: Select private checkpoint mode
        id: checkpoint
        shell: bash
        env:
          THEHEAT_THRESHOLD_CHECKPOINT_KEY: ${{ secrets.THEHEAT_THRESHOLD_CHECKPOINT_KEY }}
          THRESHOLD_RESUME_RUN: ${{ inputs.resume_run_id }}
        run: |
          if [[ -z "$THEHEAT_THRESHOLD_CHECKPOINT_KEY" && -z "$THRESHOLD_RESUME_RUN" ]]; then
            exit 0
          fi
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          python -m scripts.threshold_checkpoint_transport check-key
          if [[ -n "$THRESHOLD_RESUME_RUN" ]]; then
            [[ "$THRESHOLD_RESUME_RUN" =~ ^[1-9][0-9]{0,19}$ ]]
            echo "restore=true" >> "$GITHUB_OUTPUT"
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Verify the selected interrupted run
        if: steps.checkpoint.outputs.restore == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          THRESHOLD_RESUME_RUN: ${{ inputs.resume_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$THRESHOLD_RESUME_RUN" |
            jq -e --arg repo "$GITHUB_REPOSITORY" '
              (.path == ".github/workflows/refresh-thresholds.yml" or
               .path == ".github/workflows/refresh-thresholds.yml@main" or
               .path == ".github/workflows/refresh-thresholds.yml@refs/heads/main") and
              .head_repository.full_name == $repo and .head_branch == "main" and
              (.event == "schedule" or .event == "workflow_dispatch") and
              .run_attempt == 1 and .status == "completed" and .conclusion == "failure"
            ' > /dev/null

      - name: Download one sealed checkpoint
        if: steps.checkpoint.outputs.restore == 'true'
        uses: actions/download-artifact@v8
        with:
          name: threshold-refresh-checkpoint
          path: ${{ runner.temp }}/threshold-checkpoint-input
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Verify and open the private checkpoint
        if: steps.checkpoint.outputs.restore == 'true'
        env:
          THEHEAT_THRESHOLD_CHECKPOINT_KEY: ${{ secrets.THEHEAT_THRESHOLD_CHECKPOINT_KEY }}
          THRESHOLD_RESUME_RUN: ${{ inputs.resume_run_id }}
          THRESHOLD_DAYS: ${{ github.event.inputs.days || '12' }}
        run: |
          python -m scripts.threshold_checkpoint_transport unseal \
            --directory "$RUNNER_TEMP/threshold-refresh-private" \
            --archive "$RUNNER_TEMP/threshold-checkpoint-input/checkpoint.aead" \
            --repository "$GITHUB_REPOSITORY" --run-id "$THRESHOLD_RESUME_RUN" --days "$THRESHOLD_DAYS"

      - name: Refresh station inventory
        shell: bash
        env:
          CHECKPOINT_ENABLED: ${{ steps.checkpoint.outputs.enabled }}
        run: |
          resume_args=()
          if [[ "$CHECKPOINT_ENABLED" == true ]]; then
            resume_args=(--resume-dir "$RUNNER_TEMP/threshold-refresh-private")
          fi
          python -m scripts.refresh_station_inventory --db data/station_thresholds.sqlite "${resume_args[@]}"

      - name: Apply incremental threshold updates
        id: update
        shell: bash
        env:
          THRESHOLD_DAYS: ${{ github.event.inputs.days || '12' }}
          CHECKPOINT_ENABLED: ${{ steps.checkpoint.outputs.enabled }}
          THRESHOLD_TIMEOUT_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.catch_up == true && 1800 || 900 }}
        run: |
          resume_args=()
          if [[ "$CHECKPOINT_ENABLED" == true ]]; then
            resume_args=(--resume-dir "$RUNNER_TEMP/threshold-refresh-private")
          fi
          timeout "$THRESHOLD_TIMEOUT_SECONDS" python -m scripts.update_thresholds_incremental \
            --db data/station_thresholds.sqlite \
            --days "$THRESHOLD_DAYS" "${resume_args[@]}" || {
              code=$?
              if [[ "$code" == 124 && "$CHECKPOINT_ENABLED" == true ]]; then
                echo "timed_out=true" >> "$GITHUB_OUTPUT"
              fi
              exit "$code"
            }

      - name: Seal interrupted progress
        id: seal
        if: ${{ !cancelled() && steps.update.outputs.timed_out == 'true' }}
        env:
          THEHEAT_THRESHOLD_CHECKPOINT_KEY: ${{ secrets.THEHEAT_THRESHOLD_CHECKPOINT_KEY }}
          THRESHOLD_DAYS: ${{ github.event.inputs.days || '12' }}
        run: |
          python -m scripts.threshold_checkpoint_transport seal \
            --directory "$RUNNER_TEMP/threshold-refresh-private" \
            --archive "$RUNNER_TEMP/checkpoint.aead" \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --days "$THRESHOLD_DAYS"

      - name: Retain sealed progress for an explicit resume
        if: ${{ !cancelled() && steps.seal.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: threshold-refresh-checkpoint
          path: ${{ runner.temp }}/checkpoint.aead
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Publish verified immutable threshold artifact
        env:
          GH_TOKEN: ${{ github.token }}
          THRESHOLD_REPO: ${{ github.repository }}
        run: python -m scripts.threshold_artifacts publish --repo "$THRESHOLD_REPO"

      - name: Pack exact candidate files for protected adoption
        run: |
          python -m scripts.threshold_handoff pack \
            --directory "$RUNNER_TEMP/verified-threshold-handoff" \
            --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --base-sha "$GITHUB_SHA"

      - name: Retain verified threshold handoff
        id: handoff
        uses: actions/upload-artifact@v7
        with:
          name: verified-threshold-handoff
          path: |
            ${{ runner.temp }}/verified-threshold-handoff/station_thresholds.version
            ${{ runner.temp }}/verified-threshold-handoff/stations.csv
            ${{ runner.temp }}/verified-threshold-handoff/handoff.json
          if-no-files-found: error
          retention-days: 7

      - name: Report candidate awaiting protected adoption
        env:
          HANDOFF_DIGEST: ${{ steps.handoff.outputs.artifact-digest }}
        run: |
          printf '%s\n' 'Verified candidate awaiting protected pull request review.' \
            'The installed threshold baseline is unchanged.' \
            'Operator action: follow docs/runbooks/threshold-refresh.md before the handoff expires in 7 days.' \
            "Handoff artifact digest: $HANDOFF_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo '::warning title=Threshold adoption pending::Candidate retained; main is unchanged. Follow docs/runbooks/threshold-refresh.md to verify and adopt through a protected PR.'
